<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saudi Gazette Clone - React News Website</title>
    <script>
      ;(function () {
        try {
          const saved = localStorage.getItem('mode')
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark-mode')
          }
        } catch (e) {
          console.error(e)
        }
      })()
    </script>
    <style>
      /* --- INLINE SKELETON LOADER STYLES --- */
      :root {
        --sk-bg: #e5e7eb;
        --sk-pulse: #f3f4f6;
        --sk-border: #e1e1e1;
        --sk-body-bg: #ffffff;
      }

      .dark-mode {
        --sk-bg: #223f3f;
        --sk-pulse: #2c4e4e;
        --sk-border: #233f3f;
        --sk-body-bg: #172f2f;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--sk-body-bg);
        transition: background-color 0.25s ease;
      }

      .sk-wrapper {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 16px;
        box-sizing: border-box;
      }

      @keyframes sk-pulse-anim {
        0%,
        100% {
          background-color: var(--sk-bg);
          opacity: 0.7;
        }
        50% {
          background-color: var(--sk-pulse);
          opacity: 1;
        }
      }

      .sk-pulse {
        animation: sk-pulse-anim 1.4s infinite ease-in-out;
        border-radius: 4px;
      }

      /* Desktop navigation row simulator */
      .sk-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--sk-border);
        min-height: 94px;
        padding: 10px 0;
      }

      .sk-date {
        width: 140px;
        height: 12px;
      }

      .sk-logo {
        width: 220px;
        height: 48px;
      }

      .sk-actions {
        display: flex;
        gap: 12px;
      }

      .sk-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
      }

      /* Submenu bar simulator */
      .sk-menu {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--sk-border);
        overflow: hidden;
      }

      .sk-menu-item {
        height: 28px;
        width: 90px;
      }

      .sk-menu-item-gold {
        background-color: #335243;
        width: 120px;
        opacity: 0.85;
      }

      /* Multi-column Hero simulator */
      .sk-hero {
        display: flex;
        flex-direction: column;
        gap: 30px;
        margin-top: 20px;
      }

      @media (min-width: 769px) {
        .sk-hero {
          flex-direction: row;
          gap: 40px;
        }
      }

      .sk-hero-left {
        flex: 1;
        aspect-ratio: 16 / 10.5;
        min-height: 250px;
        max-height: 450px;
        border-radius: 6px;
      }

      .sk-hero-right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex-shrink: 0;
      }

      @media (min-width: 769px) {
        .sk-hero-right {
          width: 420px;
        }
      }

      .sk-line {
        margin-bottom: 14px;
      }

      .sk-tag {
        width: 70px;
        height: 12px;
      }

      .sk-title-1 {
        width: 100%;
        height: 26px;
        margin-top: 8px;
      }

      .sk-title-2 {
        width: 80%;
        height: 26px;
      }

      .sk-desc-1 {
        width: 100%;
        height: 14px;
        margin-top: 16px;
      }

      .sk-desc-2 {
        width: 95%;
        height: 14px;
      }

      .sk-desc-3 {
        width: 65%;
        height: 14px;
      }

      .sk-time {
        width: 125px;
        height: 12px;
        margin-top: 24px;
      }

      /* Mobile styles */
      @media (max-width: 768px) {
        .sk-mobile-hidden {
          display: none !important;
        }
        .sk-logo {
          width: 140px;
          height: 32px;
        }
        .sk-header-row {
          min-height: 60px;
          padding: 8px 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading Skeleton is replaced immediately when React hydrates -->
      <div class="sk-wrapper" id="initial-skeleton-loader">
        <div class="sk-header-row">
          <div class="sk-date sk-pulse sk-mobile-hidden"></div>
          <div class="sk-logo sk-pulse"></div>
          <div class="sk-actions">
            <div class="sk-btn sk-pulse"></div>
            <div class="sk-btn sk-pulse"></div>
          </div>
        </div>

        <div class="sk-menu">
          <div class="sk-menu-item sk-menu-item-gold"></div>
          <div class="sk-menu-item sk-pulse"></div>
          <div class="sk-menu-item sk-pulse"></div>
          <div class="sk-menu-item sk-pulse"></div>
          <div class="sk-menu-item sk-pulse sk-mobile-hidden"></div>
          <div class="sk-menu-item sk-pulse sk-mobile-hidden"></div>
          <div class="sk-menu-item sk-pulse sk-mobile-hidden"></div>
        </div>

        <div class="sk-hero">
          <div class="sk-hero-left sk-pulse"></div>
          <div class="sk-hero-right">
            <div class="sk-tag sk-line sk-pulse"></div>
            <div class="sk-title-1 sk-line sk-pulse"></div>
            <div class="sk-title-2 sk-line sk-pulse"></div>
            <div class="sk-desc-1 sk-line sk-pulse"></div>
            <div class="sk-desc-2 sk-line sk-pulse"></div>
            <div class="sk-desc-3 sk-line sk-pulse"></div>
            <div class="sk-time sk-line sk-pulse"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
